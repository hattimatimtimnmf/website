<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="generator" content="GitLab Pages">
    <title>Hattimatimtim - Mathematics Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="header-placeholder"></div>

    <section class="hero-placeholder" id="math-header">
        <div class="hero-content">
            <h2>The Mathematics Adventure! ➕➖</h2>
            <p>Welcome to the Math Hub! Choose a branch of mathematics to begin your journey.</p>
        </div>
    </section>

    <section class="lesson-grid-section">

        <button class="action-card math-category"
            data-hover="Numbers, operations, fractions, decimals, measurement, percentages and basic geometry."
            onclick="window.location.href='maths_arithmetic.html'">
            <span class="card-icon">🔢</span>
            <span class="card-title">Arithmetic</span>
        </button>

        <button class="action-card math-category"
            data-hover="Variables, expressions and equations. Coming soon!"
            onclick="window.location.href='maths_algebra.html'">
            <span class="card-icon">𝑥</span>
            <span class="card-title">Algebra</span>
        </button>

    </section>

    <div id="footer-placeholder"></div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggle = document.querySelector('.menu-toggle');
            const navLinks = document.getElementById('nav-links');
            const navRight = document.querySelector('.nav-right');

            if (menuToggle && navLinks && navRight) {
                menuToggle.addEventListener('click', function() {
                    navLinks.classList.toggle('active');
                    navRight.classList.toggle('active');
                });
            }
        });
    </script>
    <script src="components.js"></script>
</body>
